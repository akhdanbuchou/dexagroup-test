services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wfh_attendance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wfh_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wfh_attendance
      JWT_SECRET: ${JWT_SECRET:-wfh-attendance-dev-secret-change-in-production}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:4000
      JWT_SECRET: ${JWT_SECRET:-wfh-attendance-dev-secret-change-in-production}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
